<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小妖怪 · Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #0e1522;
    --bg2: #1b2a4a;
    --card: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .12);
    --text: #e9eef7;
    --muted: #9fb0c9;
    --accent: #3f7cf5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 90% at 50% 0%, #24365c 0%, transparent 60%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 24px 22px;
    backdrop-filter: blur(14px);
    text-align: center;
  }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,.18);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    margin: 0 auto 16px;
    display: block;
    background: #16203a;
  }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .3px; }
  .handle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.65; margin: 0 0 22px; }
  .btn {
    display: block;
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.04);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 10px;
    transition: transform .12s ease, background .12s ease;
    cursor: pointer;
  }
  .btn:active { transform: scale(.98); background: rgba(255,255,255,.1); }
  .btn.primary {
    background: linear-gradient(180deg, #4b8bff, #2f6ae0);
    border-color: transparent;
    box-shadow: 0 8px 22px rgba(47,106,224,.35);
  }
  .foot { color: #6f819b; font-size: 12px; margin-top: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: rgba(20,28,44,.95); border: 1px solid var(--line);
    color: var(--text); font-size: 13px; padding: 10px 16px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: all .22s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <main class="card">
    <img class="avatar" id="avatar" src="avatar.png" alt="avatar">
    <h1>小妖怪</h1>
    <p class="handle">@xiaoyaoguaisbot</p>
    <p class="desc" id="desc">这是一个 Telegram Mini App 页面。<br>由本人维护，仅用于自己的群组。</p>

    <a class="btn primary" id="joinBtn" href="https://t.me/xiaoyaoguaisbot" target="_blank" rel="noopener">
      打开机器人
    </a>
    <button class="btn" id="aboutBtn">关于这个页面</button>

    <div class="foot">Powered by Telegram Web App</div>
  </main>

  <div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window.__t);
    window.__t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0e1522');
      tg.setBackgroundColor('#1b2a4a');
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u) {
        document.getElementById('desc').innerHTML =
          '你好，' + (u.first_name || '朋友') + '。<br>由本人维护，仅用于自己的群组。';
      }
    } catch (e) {}
  }

  document.getElementById('aboutBtn').addEventListener('click', () => {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    toast('个人自用的 Telegram 小页面');
  });

  document.getElementById('joinBtn').addEventListener('click', () => {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
  });
</script>
</body>
</html>
